services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gsnipers
      POSTGRES_PASSWORD: gsnipers
      POSTGRES_DB: gsnipers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsnipers -d gsnipers"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://gsnipers:gsnipers@postgres:5432/gsnipers
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      BACKUP_LOCAL_DIR: /var/lib/gsnipers/backups
    volumes:
      - ${BACKUP_HOST_DIR:-./data/db-exports}:/var/lib/gsnipers/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
